<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beam notification reference</title><style>*{box-sizing:border-box}body:has(.notification-page){margin:0;background:#dcefff}body:has(.notification-page) .premium-header,body:has(.notification-page) .beam-preloader{display:none!important}
.notification-page{min-height:100vh;width:100%;overflow:auto}.notification-screen{position:relative;isolation:isolate;width:1080px;height:2340px;overflow:hidden;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;background:radial-gradient(ellipse at 78% 15%,#dff9ff,transparent 53%),linear-gradient(153deg,#76d0f3 0%,#369fe0 43%,#143d85 100%)}
.lock-wallpaper{position:absolute;inset:0;overflow:hidden;z-index:-1}.lock-wallpaper i{position:absolute;width:1900px;height:1500px;left:-1260px;top:860px;border-radius:50%;border:170px solid #a7edff40;transform:rotate(-38deg);box-shadow:0 0 90px #73d7ff20,inset 0 0 100px #a7edff20}.lock-wallpaper i:nth-child(2){width:2200px;height:1750px;left:-1100px;top:1010px;border-color:#59bffa4a}.lock-wallpaper i:nth-child(3){width:2500px;height:2000px;left:-945px;top:1165px;border-color:#c1f6ff27}
.lock-status{position:absolute;top:56px;left:88px;right:73px;display:flex;justify-content:space-between;align-items:center;font-size:43px;font-weight:600}.lock-status>div{display:flex;gap:15px;align-items:center}.lock-status svg{width:43px;height:37px}.lock-status svg:last-child{width:69px;height:43px}.lock-island{position:absolute;top:30px;left:380px;width:320px;height:89px;border-radius:60px;background:#080b12}.lock-icon{position:absolute;top:159px;left:517px;width:46px;height:53px;color:#184779}.lock-date{position:absolute;top:262px;left:0;right:0;text-align:center;font-size:58px;font-weight:500;letter-spacing:-1.5px;color:#174979}.lock-time{position:absolute;top:315px;left:0;right:0;text-align:center;font-size:285px;line-height:1.1;font-weight:650;letter-spacing:-15px;color:#164b7d}
.message-notification{position:absolute;top:1275px;left:36px;right:36px;display:flex;gap:27px;padding:37px 33px 39px;border:2px solid #ffffff88;border-radius:62px;background:linear-gradient(120deg,#ffffff55,#d9f4ff22 48%,#ffffff3d);backdrop-filter:blur(28px) saturate(1.65);-webkit-backdrop-filter:blur(28px) saturate(1.65);box-shadow:0 24px 65px #072f5e30,inset 0 3px 2px #ffffffaa,inset 0 -2px 1px #ffffff4d,0 0 0 1px #0b548518;color:#102c45}.message-app{flex:none;width:128px;height:128px;border-radius:29px;background:linear-gradient(#61ed78,#20c84b);margin-top:4px;display:grid;place-items:center}.message-app svg{width:111px;height:111px}.message-body{flex:1;min-width:0}.message-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.message-top strong{font-size:43px;font-weight:650;letter-spacing:-.8px}.message-top>span{font-size:32px;color:#677782}.message-body p{font-size:39px;line-height:1.34;letter-spacing:-.55px;margin:0}.message-body .message-link{color:#164e8b}
.lock-actions{position:absolute;left:124px;right:124px;bottom:170px;display:flex;justify-content:space-between}.lock-actions span{display:grid;place-items:center;width:145px;height:145px;border-radius:50%;background:#16395865;backdrop-filter:blur(20px)}.lock-actions svg{width:60px;height:60px}.lock-swipe{position:absolute;bottom:96px;left:0;right:0;text-align:center;font-size:35px;font-weight:500;letter-spacing:-.5px}.lock-home-indicator{position:absolute;bottom:30px;left:360px;width:360px;height:13px;background:white;border-radius:10px}
@media(max-width:1079px){.notification-screen{zoom:calc(100vw / 1080px)}}.notification-native .notification-screen{zoom:1}@media print{@page{size:1080px 2340px;margin:0}.notification-screen{zoom:1;print-color-adjust:exact}}

.message-notification{isolation:isolate;overflow:hidden}.message-notification::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(155deg,#ffffff45 0%,#ffffff0a 29%,transparent 47%,#b8efff14 75%,#ffffff38 100%);z-index:-1}.message-notification::after{content:'';position:absolute;inset:6px;border-radius:56px;border:1px solid #ffffff35;pointer-events:none}.message-top>span{color:#395d76}.message-body .message-link{color:#133f68}
html,body{margin:0;scrollbar-width:none}::-webkit-scrollbar{display:none}</style></head><body><main class="notification-page"><article class="notification-screen" aria-label="Illustrative iPhone lock screen with a Messages notification from Alex about a Beam"><div class="lock-wallpaper"><i></i><i></i><i></i></div><div class="lock-status"><span>9:41</span><div><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-signal" aria-hidden="true"><path d="M2 20h.01"></path><path d="M7 20v-4"></path><path d="M12 20v-8"></path><path d="M17 20V8"></path><path d="M22 4v16"></path></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wifi" aria-hidden="true"><path d="M12 20h.01"></path><path d="M2 8.82a15 15 0 0 1 20 0"></path><path d="M5 12.859a10 10 0 0 1 14 0"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-battery-full" aria-hidden="true"><path d="M10 10v4"></path><path d="M14 10v4"></path><path d="M22 14v-4"></path><path d="M6 10v4"></path><rect x="2" y="6" width="16" height="12" rx="2"></rect></svg></div></div><div class="lock-island"></div><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock-keyhole lock-icon" aria-hidden="true"><circle cx="12" cy="16" r="1"></circle><rect x="3" y="10" width="18" height="12" rx="2"></rect><path d="M7 10V7a5 5 0 0 1 10 0v3"></path></svg><div class="lock-date">Monday, September 14</div><div class="lock-time">9:41</div><section class="message-notification" aria-label="Messages notification"><div class="message-app"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 11C18.2 11 7 19.8 7 30.7c0 6.4 3.9 12.1 10 15.7l-2.4 8.2 10-4.8c2.3.5 4.8.8 7.4.8 13.8 0 25-8.9 25-19.9S45.8 11 32 11Z" fill="white"></path></svg></div><div class="message-body"><div class="message-top"><strong>Alex</strong><span>now</span></div><p>I sent you a Beam 💙</p><p>$100 of NVDA. Tap the link to claim:</p><p class="message-link">usebe.am/claim</p></div></section><div class="lock-actions"><span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-flashlight" aria-hidden="true"><path d="M12 13v1"></path><path d="M17 2a1 1 0 0 1 1 1v4a3 3 0 0 1-.6 1.8l-.6.8A4 4 0 0 0 16 12v8a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-8a4 4 0 0 0-.8-2.4l-.6-.8A3 3 0 0 1 6 7V3a1 1 0 0 1 1-1z"></path><path d="M6 6h12"></path></svg></span><span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-camera" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"></path><circle cx="12" cy="13" r="3"></circle></svg></span></div><div class="lock-swipe">Swipe up to open</div><div class="lock-home-indicator"></div></article></main></body></html>
